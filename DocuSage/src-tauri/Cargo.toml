[package]
name = "docusage"
version = "0.5.5"
description = "Private PDF chat and local AI for your desktop"
authors = ["Waqar Ahmed"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "docusage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
mistralrs = "0.7"
lancedb = "0.26"
pdf-extract = "0.10"
dotenv = "0.15"
dirs = "6.0"
fastembed = "4"
arrow-array = "57"
arrow-schema = "57"
arrow-cast = "57"
futures-util = "0.3"
keyring = "3"

reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Static linking for lzma-sys (transitive dep from lancedb) to avoid
# dynamic linking issues on Windows and in CI environments.
lzma-sys = { version = "*", features = ["static"] }

# Keep release binaries (and therefore the MSI/NSIS installers) small.
# Infers debug info is stripped via `strip`; LTO + single codegen unit
# remove dead code across the candle/lancedb/mistralrs dependency tree.
# Tests are unaffected: cargo ignores `panic` for test builds.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
panic = "abort"
incremental = false

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
