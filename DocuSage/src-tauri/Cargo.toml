[package]
name = "docusage"
version = "2.0.2"
description = "Private offline & online AI document assistant for your desktop"
authors = ["Waqar Ahmed"]
edition = "2021"

[lib]
name = "docusage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
pdf-extract = "0.10"
dotenv = "0.15"
dirs = "6.0"
keyring = "3"

reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
# In-process llama.cpp inference (same engine architecture as Neurix):
# eliminates external llama-server sidecar crashes (e.g. Windows 0xc0000005).
llama-cpp-2 = { version = "=0.1.159", default-features = false }
llama-cpp-sys-2 = "=0.1.159"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
incremental = false

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
