name: Verify & Publish Windows Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      GGML_NATIVE: "OFF"
      GGML_AVX: "OFF"
      GGML_AVX2: "OFF"
      GGML_AVX512: "OFF"
      GGML_BMI2: "OFF"
      GGML_FMA: "OFF"
      GGML_F16C: "OFF"
      GGML_SSE42: "OFF"
      GGML_CPU_REPACK: "OFF"
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check tag, version, and release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content DocuSage/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match the application version' }
          if (-not (Test-Path "DocuSage/docs/releases/$env:RELEASE_TAG.md")) { throw 'Release notes are missing' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DocuSage/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: windows-portable-x64
          workspaces: DocuSage/src-tauri -> target
      - name: Install and test frontend
        working-directory: DocuSage
        run: |
          npm ci
          npm test
      - name: Build production Windows installers
        working-directory: DocuSage
        run: npm run tauri build -- --ci
      - name: Run Rust regression tests
        working-directory: DocuSage/src-tauri
        run: cargo test --locked --release --lib --features tauri/custom-protocol --config profile.release.lto=false
      - name: Verify real Windows GGUF load, generation, and corrupt-file handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDir = Join-Path $env:RUNNER_TEMP 'docusage-gguf-selftest'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          $exe = (Resolve-Path 'DocuSage/src-tauri/target/release/docusage.exe').Path
          $modelPath = Join-Path $testDir 'qwen2.5-1.5b-instruct-q4_k_m.gguf'
          $env:DOCUSAGE_ENGINE_LOG = Join-Path $testDir 'local-engine.log'

          Write-Output 'Downloading Qwen 2.5 1.5B Instruct Q4_K_M GGUF for live Windows inference verification...'
          curl.exe -fSL --retry 3 --retry-delay 5 `
            -o $modelPath `
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf'
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Qwen 2.5 1.5B GGUF (exit $LASTEXITCODE)" }

          $stdout = Join-Path $testDir 'selftest-stdout.txt'
          $stderr = Join-Path $testDir 'selftest-stderr.txt'
          $p = Start-Process -FilePath $exe `
            -ArgumentList "--local-engine-selftest `"$modelPath`"" `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -Wait -PassThru
          Write-Output '--- Self-Test STDOUT ---'
          if (Test-Path $stdout) { Get-Content $stdout }
          Write-Output '--- Self-Test STDERR ---'
          if (Test-Path $stderr) { Get-Content $stderr }
          Write-Output '--- Engine Diagnostic Log ---'
          if (Test-Path $env:DOCUSAGE_ENGINE_LOG) { Get-Content $env:DOCUSAGE_ENGINE_LOG }
          if ($p.ExitCode -ne 0) {
            throw "Real GGUF self-test failed with exit code $($p.ExitCode)"
          }
          $outText = Get-Content $stdout -Raw
          if ($outText -notmatch 'SELFTEST_PASS') {
            throw 'Real GGUF self-test did not report SELFTEST_PASS'
          }

          $corruptPath = Join-Path $testDir 'corrupt.gguf'
          Set-Content -Path $corruptPath -Value 'NOT_A_VALID_GGUF_FILE' -NoNewline
          $cOut = Join-Path $testDir 'corrupt-stdout.txt'
          $cErr = Join-Path $testDir 'corrupt-stderr.txt'
          $cp = Start-Process -FilePath $exe `
            -ArgumentList "--local-engine-selftest `"$corruptPath`"" `
            -RedirectStandardOutput $cOut -RedirectStandardError $cErr `
            -Wait -PassThru
          Write-Output '--- Corrupt GGUF Test STDERR ---'
          if (Test-Path $cErr) { Get-Content $cErr }
          if ($cp.ExitCode -ne 1) {
            throw "Corrupt GGUF test returned unexpected exit code $($cp.ExitCode) (expected graceful exit code 1)"
          }
      - name: Install and launch both Windows packages
        shell: pwsh
        run: ./.github/scripts/test-windows-installers.ps1
      - name: Retain installer verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification
          path: ${{ runner.temp }}/docusage-installer-evidence
          if-no-files-found: warn
      - name: Publish the verified installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @(Get-ChildItem DocuSage/src-tauri/target/release/bundle/nsis/*-setup.exe)
          $assets += @(Get-ChildItem DocuSage/src-tauri/target/release/bundle/msi/*.msi)
          if ($assets.Count -ne 2) { throw 'Expected one NSIS and one MSI installer' }
          $checksums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $lines = $assets | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          Set-Content -Path $checksums -Value $lines -Encoding utf8NoBOM
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @($assets.FullName) $checksums --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "DocuSage $env:RELEASE_TAG" --notes-file "DocuSage/docs/releases/$env:RELEASE_TAG.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
          } else {
            gh release create $env:RELEASE_TAG @($assets.FullName) $checksums --repo $env:GITHUB_REPOSITORY --verify-tag --title "DocuSage $env:RELEASE_TAG" --notes-file "DocuSage/docs/releases/$env:RELEASE_TAG.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
