name: Verify Windows Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      GGML_NATIVE: "OFF"
      GGML_AVX: "OFF"
      GGML_AVX2: "OFF"
      GGML_AVX512: "OFF"
      GGML_BMI2: "OFF"
      GGML_FMA: "OFF"
      GGML_F16C: "OFF"
      GGML_SSE42: "OFF"
      GGML_CPU_REPACK: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DocuSage/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: windows-portable-x64
          workspaces: DocuSage/src-tauri -> target
      - name: Install and test frontend
        working-directory: DocuSage
        run: |
          npm ci
          npm test
      - name: Build production desktop executable
        working-directory: DocuSage
        run: npm run tauri build -- --no-bundle
      - name: Run Rust regression tests
        working-directory: DocuSage/src-tauri
        run: cargo test --locked --release --lib --features tauri/custom-protocol --config profile.release.lto=false
      - name: Verify real Windows GGUF load, generation, and corrupt-file handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDir = Join-Path $env:RUNNER_TEMP 'docusage-gguf-selftest'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          $exe = (Resolve-Path 'DocuSage/src-tauri/target/release/docusage.exe').Path
          $modelPath = Join-Path $testDir 'qwen2.5-1.5b-instruct-q4_k_m.gguf'
          $env:DOCUSAGE_ENGINE_LOG = Join-Path $testDir 'local-engine.log'

          curl.exe -fSL --retry 3 --retry-delay 5 `
            -o $modelPath `
            'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf'
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Qwen 2.5 1.5B GGUF (exit $LASTEXITCODE)" }

          $stdout = Join-Path $testDir 'selftest-stdout.txt'
          $stderr = Join-Path $testDir 'selftest-stderr.txt'
          $p = Start-Process -FilePath $exe `
            -ArgumentList "--local-engine-selftest `"$modelPath`"" `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -Wait -PassThru
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($p.ExitCode -ne 0) { throw "Real GGUF self-test failed with exit code $($p.ExitCode)" }
          if ((Get-Content $stdout -Raw) -notmatch 'SELFTEST_PASS') { throw 'Missing SELFTEST_PASS' }

          $corruptPath = Join-Path $testDir 'corrupt.gguf'
          Set-Content -Path $corruptPath -Value 'NOT_A_VALID_GGUF_FILE' -NoNewline
          $cOut = Join-Path $testDir 'corrupt-stdout.txt'
          $cErr = Join-Path $testDir 'corrupt-stderr.txt'
          $cp = Start-Process -FilePath $exe `
            -ArgumentList "--local-engine-selftest `"$corruptPath`"" `
            -RedirectStandardOutput $cOut -RedirectStandardError $cErr `
            -Wait -PassThru
          if (Test-Path $cErr) { Get-Content $cErr }
          if ($cp.ExitCode -ne 1) { throw "Corrupt GGUF test returned unexpected exit code $($cp.ExitCode)" }
      - name: Smoke-test production executable startup
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'docusage-startup-smoke'
          $env:APPDATA = Join-Path $fixture 'config'
          $env:LOCALAPPDATA = Join-Path $fixture 'data'
          $env:MODEL_PATH = Join-Path $fixture 'models'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:MODEL_PATH | Out-Null
          $process = Start-Process -FilePath 'DocuSage/src-tauri/target/release/docusage.exe' -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "Desktop exited during startup with code $($process.ExitCode)"
            }
            Write-Output 'Production executable remained running after native startup. This is a launch smoke test, not an installer or UI certification.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-source-build
          path: DocuSage/src-tauri/target/release/docusage.exe
